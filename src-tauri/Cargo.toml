[package]
name = "pulse"
version = "1.3.0"
edition = "2021"
default-run = "pulse"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pulse"
path = "src/main.rs"

[[bin]]
name = "pulse-cli"
path = "src/bin/pulse-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "cookies", "socks"] }
hmac = "0.12"
md-5 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
time = "=0.3.36"
once_cell = "1.19"
dirs = "5"
tiny_http = "0.12.0"
url = "2.5.8"
base64 = "0.22.1"
sha2 = "0.10.9"
rand = "0.8"
log = "0.4"
env_logger = "0.10"
open = "5.3.3"
boa_engine = "0.19"
fake = "2.9.2"
clap = { version = "4", features = ["derive"] }
openapiv3 = "2"
diff = "0.1"
regex = "1.10"
fuzzy-matcher = "0.3.7"
tauri-plugin-notification = "2"
async-recursion = "1.1.1"
keyring = "2"
hdrhistogram = "7.5"
jsonschema = "0.18"
tokio-tungstenite = { version = "0.21", features = ["connect", "handshake"] }
eventsource-stream = "0.2"
futures-util = "0.3"
tonic = { version = "0.11", default-features = false, features = ["transport", "codegen", "prost"] }
prost = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
